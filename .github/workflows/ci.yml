name: interface-contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
  snakemake-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . snakemake==9.27.0
      - run: python tests/integration_smoke.py
      - run: python tests/integration_v02.py
      - run: python tests/integration_general_genome.py
      - run: python tests/integration_candidate_wrapper.py
      - run: python tests/integration_reviewed_import.py
      - run: python tests/integration_cli.py
      - run: python tests/integration_parallel.py --pool-threads 4
      - run: python tests/integration_control.py
      - name: Verify the resource tests with one inherited CPU
        shell: bash
        run: |
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" python -m unittest discover -s tests -p test_resources_v06.py -v
  build-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine snakemake==9.27.0
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/teflow-wheel"
          wheels=(dist/*.whl)
          "$RUNNER_TEMP/teflow-wheel/bin/python" -m pip install --no-deps "${wheels[0]}"
          env -u PYTHONPATH -u TEFLOW_REPOSITORY "$RUNNER_TEMP/teflow-wheel/bin/python" \
            tests/integration_cli.py --installed
          env -u PYTHONPATH -u TEFLOW_REPOSITORY "$RUNNER_TEMP/teflow-wheel/bin/python" \
            tests/integration_control.py --installed
          env -u PYTHONPATH -u TEFLOW_REPOSITORY "$RUNNER_TEMP/teflow-wheel/bin/python" \
            tests/integration_parallel.py --installed --pool-threads 4
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/teflow-wheel/bin/teflow-runtime-check" --help)
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
